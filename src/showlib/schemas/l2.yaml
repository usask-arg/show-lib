product: L2
schema_version: 0.1.0
status: draft
description: >
  Retrieved water vapour profiles, one per L1B image, with the co-retrieved
  stratospheric aerosol extinction, their uncertainties and averaging kernels,
  and retrieval diagnostics. A granule holds the profiles of
  one L1B granule.

model:
  retrieval: |
    Each profile is a regularized least-squares (optimal-estimation style) fit of
    the SASKTRAN2 forward model, convolved with the L1B instrument line shapes,
    to the L1B radiances of one image. The state x holds the H2O VMR and aerosol
    extinction profiles on `altitude`, and the surface albedo and nuisance terms
    (wavenumber shifts and spectral splines), which are not stored. With the
    Jacobian K, the measurement noise covariance S_ε (from radiance_noise, and
    its correlation between samples when the L1B noise model allows), and the
    regularization precision R (Tikhonov smoothing plus a weak pull towards the
    prior), at the solution:

      Ŝ = (Kᵀ S_ε⁻¹ K + R)⁻¹               solution covariance
      G = Ŝ Kᵀ S_ε⁻¹                        gain matrix
      A = G K                               averaging kernel
      S_noise = G S_ε Gᵀ                    error covariance from measurement noise

    `*_noise_error` is the square root of the diagonal of S_noise and
    `*_solution_error` that of Ŝ. Ŝ = S_noise + (A − I) R⁻¹ (A − I)ᵀ is the total
    of noise and smoothing error only when R⁻¹ is the true covariance of the
    atmosphere; with an ad hoc regularization, treat it as an indication of the
    smoothing error rather than its value. Neither includes forward-model,
    instrument-model, or program-of-record errors.

    Quantities retrieved in log space (see the `*_retrieval_space` attributes)
    have their errors converted to physical units to first order, σ_x = x · σ_ln x,
    and their averaging kernels are ∂ ln x̂ / ∂ ln x, a fractional response.

dimensions:
  time:
    coordinate: true
    description: Profile; one per retrieved L1B image, at the image's time.
  altitude:
    coordinate: true
    description: Retrieval altitude grid.
  altitude2:
    coordinate: true
    description: >
      Copy of `altitude` for the second axis of the averaging kernels, the level
      of the true-state perturbation.

file:
  filename_pattern: "HAWC_H2OL_Wvapor_L2_{YYYYMMDD}T{HHMM}.v{version}.STD.nc"
  description: >
    One file holds the profiles retrieved from one L1B granule, named after it
    with Radiances_L1B replaced by Wvapor_L2.

attributes:
  schema_version:
    dtype: str
    required: true
    role: processing
    description: Version of this schema the granule conforms to.

  h2o_retrieval_space:
    dtype: str
    allowed: [linear, log]
    required: true
    role: processing
    description: >
      Whether H2O VMR was retrieved directly or as its logarithm. Determines the
      meaning of h2o_vmr_averaging_kernel.

  aerosol_retrieval_space:
    dtype: str
    allowed: [linear, log]
    required: false
    role: processing
    description: >
      Whether aerosol extinction was retrieved directly or as its logarithm.
      Present when aerosol_extinction is.

  aerosol_extinction_wavelength:
    dtype: float
    units: nm
    required: false
    exclusive_min: 0
    role: processing
    description: >
      Wavelength at which aerosol_extinction is given. Present when
      aerosol_extinction is.

variables:
  # ------------------------------------------------------------------- geometry
  time:
    dims: [time]
    dtype: datetime
    required: true
    role: geometry
    description: Time of the L1B image the profile was retrieved from.

  altitude:
    dims: [altitude]
    dtype: float
    units: m
    required: true
    role: geometry
    description: >
      Geometric altitude above the WGS84 ellipsoid, on the same reference as the
      L1B tangent altitudes.

  altitude2:
    dims: [altitude2]
    dtype: float
    units: m
    required: true
    role: geometry
    description: Equal to `altitude`.

  latitude:
    dims: [time]
    dtype: float
    units: degrees_north
    required: true
    valid_min: -90
    valid_max: 90
    role: geometry
    description: >
      Reference latitude of the profile: the mean tangent latitude of the lines
      of sight used in the retrieval.

  longitude:
    dims: [time]
    dtype: float
    units: degrees_east
    required: true
    role: geometry
    description: >
      Reference longitude of the profile: the mean tangent longitude of the lines
      of sight used in the retrieval.

  # ------------------------------------------------------------------------ H2O
  h2o_vmr:
    dims: [time, altitude]
    dtype: float
    units: "1"
    required: true
    role: measurement
    description: Retrieved water vapour volume mixing ratio (mol mol-1).

  h2o_vmr_prior:
    dims: [time, altitude]
    dtype: float
    units: "1"
    required: true
    role: processing
    description: >
      Prior (a priori) H2O VMR the regularization pulls towards; also the initial
      guess.

  h2o_vmr_noise_error:
    dims: [time, altitude]
    dtype: float
    units: "1"
    required: true
    valid_min: 0
    role: measurement
    description: One-sigma error of h2o_vmr from measurement noise, √diag(S_noise).

  h2o_vmr_solution_error:
    dims: [time, altitude]
    dtype: float
    units: "1"
    required: true
    valid_min: 0
    role: measurement
    description: >
      One-sigma error of h2o_vmr from the solution covariance, √diag(Ŝ); see the
      model section for when it is a total error.

  h2o_vmr_averaging_kernel:
    dims: [time, altitude, altitude2]
    dtype: float
    units: "1"
    required: true
    role: measurement
    description: >
      Averaging kernel of h2o_vmr: element [i, j] is the response of the retrieved
      value at altitude i to a perturbation of the true state at altitude2 j.

  # -------------------------------------------------------------------- aerosol
  aerosol_extinction:
    dims: [time, altitude]
    dtype: float
    units: m-1
    required: false
    valid_min: 0
    role: measurement
    description: >
      Co-retrieved stratospheric aerosol extinction at
      aerosol_extinction_wavelength. Absent when aerosol is not retrieved.

  aerosol_extinction_prior:
    dims: [time, altitude]
    dtype: float
    units: m-1
    required: false
    valid_min: 0
    role: processing
    description: >
      Prior aerosol extinction: the preprocessor's fit, or the program of
      record's profile when it has one, floored for log space.

  aerosol_extinction_noise_error:
    dims: [time, altitude]
    dtype: float
    units: m-1
    required: false
    valid_min: 0
    role: measurement
    description: One-sigma error of aerosol_extinction from measurement noise.

  aerosol_extinction_solution_error:
    dims: [time, altitude]
    dtype: float
    units: m-1
    required: false
    valid_min: 0
    role: measurement
    description: One-sigma error of aerosol_extinction from the solution covariance.

  aerosol_extinction_averaging_kernel:
    dims: [time, altitude, altitude2]
    dtype: float
    units: "1"
    required: false
    role: measurement
    description: Averaging kernel of aerosol_extinction, laid out as for H2O.

  # ---------------------------------------------------------------- ancillary
  tropopause_altitude:
    dims: [time]
    dtype: float
    units: m
    required: true
    role: processing
    description: Tropopause altitude from the program of record.

  # --------------------------------------------------------------- diagnostics
  lower_altitude_limit:
    dims: [time]
    dtype: float
    units: m
    required: true
    role: quality
    description: >
      Lowest tangent altitude used: the configured lower bound, or the
      preprocessor's estimate of the lowest usable altitude (for example above
      cloud). The profile below it is constrained only by the regularization.

  upper_altitude_limit:
    dims: [time]
    dtype: float
    units: m
    required: true
    role: quality
    description: Highest tangent altitude used.

  num_los:
    dims: [time]
    dtype: int
    units: "1"
    required: true
    valid_min: 1
    role: quality
    description: >
      Number of lines of sight used, after row reduction, altitude limits, and
      saturation. With row averaging, each averaged group of rows counts once.

  cost:
    dims: [time]
    dtype: float
    units: "1"
    required: true
    valid_min: 0
    role: quality
    description: >
      Final value of the minimized objective, (χ²_measurement + χ²_regularization)
      divided by the number of measurements. About 1 for a fit consistent with
      the noise; much larger values indicate a poor fit.

  optimizer_status:
    dims: [time]
    dtype: int
    units: "1"
    required: true
    role: quality
    description: >
      Termination status of scipy.optimize.least_squares: 1 to 4 are convergence
      criteria, 0 is the evaluation limit, -1 is a failure.

  converged:
    dims: [time]
    dtype: bool
    required: true
    role: quality
    description: >
      True when the optimizer met a convergence criterion (optimizer_status > 0).
      A profile that stopped at the evaluation limit may still be usable; check
      cost.

  num_function_evaluations:
    dims: [time]
    dtype: int
    units: "1"
    required: true
    valid_min: 0
    role: quality
    description: Forward-model evaluations used by the optimizer.

  # ------------------------------------------------------------- quality flags
  profile_quality_flag:
    dims: [time]
    dtype: int
    units: "1"
    required: true
    valid_min: 0
    role: quality
    open_questions: [quality-flag]
    description: >
      Placeholder for a quality flag of the whole profile. Always 0, not
      assessed; other values are reserved until the flag is defined.

  h2o_vmr_quality_flag:
    dims: [time, altitude]
    dtype: int
    units: "1"
    required: true
    valid_min: 0
    role: quality
    open_questions: [quality-flag]
    description: >
      Placeholder for a quality flag of each altitude of h2o_vmr. Always 0, not
      assessed; other values are reserved until the flag is defined.

constraints:
  - id: time-increasing
    rule: time is strictly increasing within a granule.
  - id: altitude-increasing
    rule: altitude is strictly increasing.
  - id: kernel-grid
    rule: altitude2 equals altitude.
  - id: aerosol-complete
    rule: >
      If any aerosol_extinction variable is present, then aerosol_extinction,
      its prior, both errors, its averaging kernel, aerosol_retrieval_space and
      aerosol_extinction_wavelength are all present.
  - id: finite-values
    rule: h2o_vmr and both of its errors are finite everywhere.

open_questions:
  - id: quality-flag
    question: >
      Which profiles, and which altitudes of a profile, should users treat as
      good, and should L2 carry a quality flag for it?
    context: >
      Candidates are cost, converged, the averaging-kernel row sum (measurement
      response) at each altitude, and altitudes below lower_altitude_limit. The
      thresholds need validation against simulations and coincident
      measurements before the flags are defined. Until then
      profile_quality_flag and h2o_vmr_quality_flag are placeholders, always 0
      (not assessed), and the diagnostics are stored for users to filter on.
