product: L1A
schema_version: 0.3.0
status: draft
description: >
  SHOW detector images of raw data with geolocation information appended. A granule
  holds a time series of images.

dimensions:
  time:
    coordinate: true
    description: Image within the granule.
  los:
    description: Detector row. Each row corresponds to a viewing tangent altitude.
  pixelcolumn:
    description: >
      Detector column. The optical path difference across each pixel is `opd` in
      the calibration database.

file:
  description: >
    One file is a granule: a collection of consecutive images along `time`, for
    example a quarter orbit.

attributes:
  schema_version:
    dtype: str
    required: true
    role: processing
    description: Version of this schema the granule conforms to.

variables:
  # ---------------------------------------------------------------- measurement
  image:
    dims: [time, los, pixelcolumn]
    dtype: float
    units: count
    required: true
    role: measurement
    description: >
      Raw detector signal, before any correction. When several exposures are
      averaged into one image, this is their mean.

  # ------------------------------------------------------------------- geometry
  time:
    dims: [time]
    dtype: datetime
    required: true
    role: geometry
    description: >
      Midpoint of the image's exposure. When several exposures are averaged, the
      midpoint between the start of the first and the end of the last.

  tangent_altitude:
    dims: [time, los]
    dtype: float
    units: m
    required: true
    role: geometry
    description: >
      Geometric (unrefracted) tangent altitude of each line of sight above the
      WGS84 ellipsoid.

  tangent_latitude:
    dims: [time, los]
    dtype: float
    units: degrees_north
    required: true
    valid_min: -90
    valid_max: 90
    role: geometry
    description: WGS84 geodetic latitude of each geometric (unrefracted) tangent point.

  tangent_longitude:
    dims: [time, los]
    dtype: float
    units: degrees_east
    required: true
    role: geometry
    description: WGS84 longitude of each geometric (unrefracted) tangent point.

  spacecraft_latitude:
    dims: [time]
    dtype: float
    units: degrees_north
    required: true
    valid_min: -90
    valid_max: 90
    role: geometry
    description: WGS84 geodetic latitude of the observer.

  spacecraft_longitude:
    dims: [time]
    dtype: float
    units: degrees_east
    required: true
    role: geometry
    description: WGS84 longitude of the observer.

  spacecraft_altitude:
    dims: [time]
    dtype: float
    units: m
    required: true
    role: geometry
    description: Altitude of the observer above the WGS84 ellipsoid.

  solar_zenith_angle:
    dims: [time, los]
    dtype: float
    units: degree
    required: true
    valid_min: 0
    valid_max: 180
    role: geometry
    description: Solar zenith angle at each tangent point.

  relative_solar_azimuth_angle:
    dims: [time, los]
    dtype: float
    units: degree
    required: true
    valid_min: -180
    valid_max: 180
    role: geometry
    description: >
      Solar azimuth minus line-of-sight azimuth at each tangent point, wrapped to
      [-180, 180). 0 is forward scatter (looking towards the sun); ±180 is
      backscatter.

  los_azimuth_angle:
    dims: [time, los]
    dtype: float
    units: degree
    required: true
    valid_min: 0
    valid_max: 360
    role: geometry
    description: >
      Azimuth of the line of sight (direction from the observer through the tangent
      point) at the tangent point, clockwise from true north (0 north, 90 east),
      wrapped to [0, 360).

  # ---------------------------------------------------------------- acquisition
  exposure_time:
    dims: [time]
    dtype: float
    units: s
    required: true
    exclusive_min: 0
    role: acquisition
    description: Integration time of a single exposure.

  num_averaged_exposures:
    dims: [time]
    dtype: int
    units: "1"
    required: false
    default: 1
    valid_min: 1
    role: acquisition
    description: Number of equal exposures averaged into the image.

  detector_temperature:
    dims: [time]
    dtype: float
    units: K
    required: false
    exclusive_min: 0
    role: acquisition
    open_questions: [dark-determination]
    description: >
      Detector temperature during the image, for a future temperature-dependent
      dark estimate. Not yet used by L1A→L1B.

  actual_acquisition_time:
    dims: [time]
    dtype: float
    units: s
    required: false
    valid_min: 0
    role: acquisition
    description: Time from the start of the first exposure to the end of the last.

  # -------------------------------------------------------------------- quality
  saturated:
    dims: [time, los, pixelcolumn]
    dtype: bool
    required: false
    role: quality
    description: >
      True where any averaged exposure saturated. Any saturated pixel in a row
      marks the whole L1B row as saturated.

groups:
  simulation:
    description: >
      Simulator-only diagnostics, present only in simulated granules. L1A→L1B
      processing never reads this group.
    variables:
      image_noiseless:
        dims: [time, los, pixelcolumn]
        dtype: float
        units: count
        required: false
        role: simulator_truth
        description: >
          Expected `image` before noise, saturation and digitization, including
          the dark signal.

      target_acquisition_time:
        dims: [time]
        dtype: float
        units: s
        required: false
        valid_min: 0
        role: simulator_truth
        description: Requested total acquisition time, including dead time.

      auto_exposure_full_well_fraction:
        dims: [time]
        dtype: float
        units: "1"
        required: false
        valid_min: 0
        valid_max: 1
        role: simulator_truth
        description: >
          Fraction of the saturation level the auto-exposure targets for the
          brightest pixel. The saturation level is the lower of the full well and
          the ADC range above the pixel's dark offset, in electrons.

      expected_peak_full_well_fraction:
        dims: [time]
        dtype: float
        units: "1"
        required: false
        role: simulator_truth
        description: >
          Largest noise-free photo- plus dark-current electrons of any pixel, as a
          fraction of that pixel's saturation level (see
          auto_exposure_full_well_fraction).

      noise_enabled:
        dims: []
        dtype: bool
        required: false
        role: simulator_truth
        description: Whether the simulator applied a noise realization.

      noise_seed:
        dims: []
        dtype: int
        required: false
        role: simulator_truth
        description: Random seed used for the noise realization.

constraints:
  - id: time-increasing
    rule: time is strictly increasing within a granule.
  - id: image-finite
    rule: Every element of `image` is finite.
  - id: detector-matches-calibration
    rule: >
      los and pixelcolumn have the same lengths as in the calibration database
      used to process the granule.

open_questions:
  - id: dark-determination
    question: How is the dark signal measured in flight?
    context: >
      Options include dark frames (shutter closed or a blank scene) between
      observation sets, interpolated to each image in detector temperature, or
      masked detector rows or columns. Dark frames may need their own flag or
      group in L1A. Until this is decided, L1A→L1B subtracts the static dark from
      the calibration database (its dark-model open question).
