product: L1B
schema_version: 0.2.0
status: draft
description: >
  Calibrated radiance spectra, one spectrum per line of sight, with geolocation.
  A granule holds a time series of images.

dimensions:
  time:
    coordinate: true
    description: Image within the granule.
  los:
    description: Line of sight; one per L1A detector row.
  spectral_sample:
    description: >
      Spectral sample, in increasing wavenumber. The wavenumber of each sample is
      given per line of sight by `wavenumber`.

file:
  filename_pattern: "HAWC_H2OL_Radiances_L1B_{YYYYMMDD}T{HHMM}.v{version}.STD.nc"
  description: >
    One file is a granule: a collection of consecutive images along `time`, for
    example a quarter orbit.

attributes:
  schema_version:
    dtype: str
    required: true
    role: processing
    description: Version of this schema the granule conforms to.

  apodization_window:
    dtype: str
    allowed: [rectangular, kaiser]
    required: true
    role: processing
    description: >
      Window applied over OPD in the L1A→L1B inversion. Together with the
      calibration database it determines the instrument line shape.

  apodization_beta:
    dtype: float
    required_when: {apodization_window: kaiser}
    valid_min: 0
    role: processing
    description: Kaiser window beta.

  radiance_noise_model:
    dtype: str
    allowed: [none, fractional, detector, detector+fractional]
    required: true
    role: processing
    description: Which noise sources contributed to radiance_noise.

variables:
  # ----------------------------------------------------------- spectral axis
  wavenumber:
    dims: [los, spectral_sample]
    dtype: float
    units: cm-1
    required: true
    valid_min: 0
    role: instrument
    description: >
      Vacuum wavenumber of each spectral sample for each line of sight, from
      sample_wavenumber in the calibration database. Fixed within a granule.

  # ---------------------------------------------------------------- measurement
  radiance:
    dims: [time, los, spectral_sample]
    dtype: float
    units: W m-2 sr-1 nm-1
    required: true
    role: measurement
    description: Spectral radiance.

  radiance_noise:
    dims: [time, los, spectral_sample]
    dtype: float
    units: W m-2 sr-1 nm-1
    required: true
    valid_min: 0
    role: measurement
    description: >
      One-sigma random-noise estimate. Only the diagonal is stored; noise
      correlation between spectral samples is not.

  # ------------------------------------------------------------------- geometry
  time:
    dims: [time]
    dtype: datetime
    required: true
    role: geometry
    description: >
      Midpoint of the image's exposure. When several exposures are averaged, the
      midpoint between the start of the first and the end of the last.

  tangent_altitude:
    dims: [time, los]
    dtype: float
    units: m
    required: true
    role: geometry
    description: >
      Geometric (unrefracted) tangent altitude of each line of sight above the
      WGS84 ellipsoid.

  tangent_latitude:
    dims: [time, los]
    dtype: float
    units: degrees_north
    required: true
    valid_min: -90
    valid_max: 90
    role: geometry
    description: WGS84 geodetic latitude of each geometric (unrefracted) tangent point.

  tangent_longitude:
    dims: [time, los]
    dtype: float
    units: degrees_east
    required: true
    role: geometry
    description: WGS84 longitude of each geometric (unrefracted) tangent point.

  spacecraft_latitude:
    dims: [time]
    dtype: float
    units: degrees_north
    required: true
    valid_min: -90
    valid_max: 90
    role: geometry
    description: WGS84 geodetic latitude of the observer.

  spacecraft_longitude:
    dims: [time]
    dtype: float
    units: degrees_east
    required: true
    role: geometry
    description: WGS84 longitude of the observer.

  spacecraft_altitude:
    dims: [time]
    dtype: float
    units: m
    required: true
    role: geometry
    description: Altitude of the observer above the WGS84 ellipsoid.

  solar_zenith_angle:
    dims: [time, los]
    dtype: float
    units: degree
    required: true
    valid_min: 0
    valid_max: 180
    role: geometry
    description: Solar zenith angle at each tangent point.

  relative_solar_azimuth_angle:
    dims: [time, los]
    dtype: float
    units: degree
    required: true
    valid_min: -180
    valid_max: 180
    role: geometry
    description: >
      Solar azimuth minus line-of-sight azimuth at each tangent point, wrapped to
      [-180, 180). 0 is forward scatter (looking towards the sun); ±180 is
      backscatter.

  los_azimuth_angle:
    dims: [time, los]
    dtype: float
    units: degree
    required: true
    valid_min: 0
    valid_max: 360
    role: geometry
    description: >
      Azimuth of the line of sight (direction from the observer through the tangent
      point) at the tangent point, clockwise from true north (0 north, 90 east),
      wrapped to [0, 360).

  # -------------------------------------------------------------------- quality
  saturated_fraction:
    dims: [time, los]
    dtype: float
    units: "1"
    required: true
    valid_min: 0
    valid_max: 1
    role: quality
    description: >
      Fraction of the row's L1A pixels that saturated. Rows with a value above 0
      should be excluded from retrievals; their radiance and radiance_noise are
      still finite.

constraints:
  - id: time-increasing
    rule: time is strictly increasing within a granule.
  - id: wavenumber-increasing
    rule: wavenumber is strictly increasing along spectral_sample for every los.
  - id: uniform-processing
    rule: >
      Every image in a granule was processed with the same settings, so the global
      processing attributes apply to the whole granule. Writers check this rather
      than keeping the first image's attributes.
  - id: finite-values
    rule: radiance and radiance_noise are finite everywhere.

open_questions: []
