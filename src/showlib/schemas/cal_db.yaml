product: CAL_DB
schema_version: 0.4.0
status: draft
description: >
  SHOW calibration database: the parameters of the instrument forward model A, which
  maps spectral radiance to the L1A detector image, and the L1B output grid. The
  L1A→L1B inverse B and the instrument line shape B·A are computed from these
  parameters and the L1B processing settings; they are not stored.

model:
  forward: |
    The expected signal of detector pixel (y, x), in counts, for an exposure of
    time t (from L1A):

      I(y,x) = D(y,x) + (t / g) · ε(y,x) · ∫ T(ν) · L(ν) · (dλ/dν) / E(ν)
                          · [ 1 + V(y,x) · C(y,x,ν) ] dν

      D(y,x) = o(y,x) + t · k(y,x)

      C(y,x,ν) = (1 / |P|) ∬_P cos( 2π (ν − σ(v)) · s(ν) · d(u,v)
                                   + φ(u,v) + ψ(ν) ) du dv

    where
      L(ν)    spectral radiance [W m-2 sr-1 nm-1]
      dλ/dν   1e7 / ν² [nm per cm-1], converting per-nm radiance to per-wavenumber
      E(ν)    photon energy h·c·ν [J]
      D       dark signal [count]
      o       dark_offset [count], the bias at zero exposure
      k       dark_current [count s-1] (0 when absent)
      g       detector_gain [electrons per count]
      ε       pixel_etendue [m2 sr]
      T       spectral_transmission
      V       fringe_visibility
      d, φ    opd and fringe_phase, defined at pixel corners
      σ       littrow_wavenumber, defined at row edges
      s, ψ    fringe_frequency_scale and dispersion_phase, functions of
              wavenumber only (1 and 0 when absent)

    C is the fringe averaged over the pixel area P, with uniform response across
    the pixel. u runs across the pixel along pixelcolumn and v along los, each
    from one edge to the other. d and φ are bilinear between the four corner
    values and σ is linear between the two row edges. The pixel average therefore
    includes fringe tilt across the pixel and the variation of OPD and Littrow
    wavenumber along both detector axes. When d is
    linear across the pixel, σ and φ are constant, and there is no dispersion
    (s = 1, ψ = 0), C reduces to sinc((ν − σ)·w) · cos(2π(ν − σ)·d_centre + φ)
    for a pixel of OPD width w.

    Dispersion is separable: s(ν) stretches the OPD scale (fringe-frequency
    dispersion from the grating and prisms), and ψ(ν) adds a wavenumber-dependent
    phase (unequal glass in the two arms). Both are interpolated linearly in
    wavenumber from dispersion_wavenumber.

    Grating tilt. A tilt ε of one grating about the dispersion axis tilts that
    arm's wavefront by 2ε along y and adds a fringe phase ±2π · 2εy · ν, where y is
    the height on the grating (the detector position divided by the detector-to-
    grating magnification). The sign is + when the tilted grating is in the arm
    whose path counts positive in opd. Because
      2π · 2εy · ν = 2π (ν − σ) · 2εy + 2π σ · 2εy,
    the tilt is the corner values
      opd          → opd ± 2εy
      fringe_phase → fringe_phase ± 2π σ · 2εy
    with y and σ at each corner's row edge. This is exact when σ is constant
    across the row; OPD then varies along los, and the pixel average includes the
    contrast lost across the row height Δy (on the grating), a factor
    sinc(2εΔy · ν) with sinc(x) = sin(πx) / (πx). Two caveats:
      - s(ν) multiplies the whole OPD, including the tilt term 2εy, but the tilt
        phase 2π · 2εy · ν is not dispersed by the grating. The mapping is
        therefore exact only without fringe-frequency dispersion (s = 1).
      - Measuring opd and fringe_phase at a corner needs fringe phases at two or
        more wavenumbers. At a single wavenumber an OPD offset δ changes the phase
        by the constant 2π (ν − σ) δ, which a fringe_phase offset reproduces.

    Detector. Each exposure has Poisson shot noise on the photo-electrons and the
    dark-current electrons (t · k · g), Gaussian read noise, and is quantized to
    integer counts. A pixel saturates at detector_full_well electrons or when the
    signal, including the offset o, reaches the ADC maximum
    2^detector_adc_bits − 1 counts, whichever comes first.
  inverse: |
    L1A→L1B first subtracts a dark estimate D from each image and divides by t,
    giving the count rate. D defaults to the static dark o + t · k from this
    database; the processing accepts any other estimate (for example one
    interpolated between dark frames), so the method can change without changing
    the rest of L1A→L1B. The shot noise is that of the photo- and dark-current
    electrons, (S − o) · g for image S, so the variance of a mean of N exposures
    is ((S − o) · g + σ_read² + g² / 12) / (N g²) counts². The dark estimate's
    own noise is not included.

    B, for each row, is a linear least-squares inversion of the same
    pixel-averaged model evaluated at that row's sample_wavenumber, with a DC term
    and the L1B apodization window applied over the row's OPD. B is a processing
    choice and is recorded by the L1B apodization attributes. The line shape of
    each L1B sample is the corresponding row of B·A, so it always matches the
    processing that produced the L1B.

dimensions:
  los:
    description: Detector row; matches los in L1A.
  los_edge:
    description: Detector row boundaries; len(los) + 1.
  pixelcolumn:
    description: Detector column; matches pixelcolumn in L1A.
  pixelcolumn_edge:
    description: Detector column boundaries; len(pixelcolumn) + 1.
  spectral_sample:
    description: L1B spectral sample; matches spectral_sample in L1B.
  dispersion_wavenumber:
    coordinate: true
    description: Grid on which the dispersion functions are tabulated.
  transmission_wavenumber:
    coordinate: true
    description: Grid on which spectral_transmission is tabulated.

attributes:
  schema_version:
    dtype: str
    required: true
    role: processing
    description: Version of this schema the database conforms to.

  valid_from:
    dtype: str
    required: true
    role: processing
    description: >
      Start of the period this calibration applies to, as an ISO 8601 UTC
      timestamp.

  valid_to:
    dtype: str
    required: false
    role: processing
    description: >
      End of the period this calibration applies to, as an ISO 8601 UTC timestamp.
      Absent means open-ended.

variables:
  # ------------------------------------------------------------- fringe geometry
  opd:
    dims: [los_edge, pixelcolumn_edge]
    dtype: float
    units: cm
    required: true
    role: instrument
    description: >
      Optical path difference at each pixel corner, relative to zero path
      difference. Need not be uniformly spaced.

  fringe_phase:
    dims: [los_edge, pixelcolumn_edge]
    dtype: float
    units: rad
    required: false
    default: 0.0
    role: instrument
    description: Fringe phase offset at each pixel corner.

  littrow_wavenumber:
    dims: [los_edge]
    dtype: float
    units: cm-1
    required: true
    exclusive_min: 0
    role: instrument
    description: Littrow (heterodyne) vacuum wavenumber at each row boundary.

  fringe_visibility:
    dims: [los, pixelcolumn]
    dtype: float
    units: "1"
    required: false
    default: 1.0
    valid_min: 0
    valid_max: 1
    role: instrument
    description: >
      Intrinsic fringe contrast of each pixel. Excludes the loss from averaging
      over the pixel area, which the model computes.

  # ----------------------------------------------------------------- dispersion
  fringe_frequency_scale:
    dims: [dispersion_wavenumber]
    dtype: float
    units: "1"
    required: false
    default: 1.0
    valid_min: 0
    role: instrument
    description: >
      s(ν): factor multiplying the OPD scale at each wavenumber, describing
      fringe-frequency dispersion. Equal to 1 at dispersion_reference_wavenumber.

  dispersion_phase:
    dims: [dispersion_wavenumber]
    dtype: float
    units: rad
    required: false
    default: 0.0
    role: instrument
    description: >
      ψ(ν): wavenumber-dependent fringe phase common to all pixels. Zero, with
      zero slope, at dispersion_reference_wavenumber.

  dispersion_wavenumber:
    dims: [dispersion_wavenumber]
    dtype: float
    units: cm-1
    required: false
    exclusive_min: 0
    role: instrument
    description: Vacuum wavenumbers at which the dispersion functions are tabulated.

  dispersion_reference_wavenumber:
    dims: []
    dtype: float
    units: cm-1
    required: false
    valid_min: 0
    role: instrument
    description: >
      Wavenumber at which the dispersion functions are pinned (see the
      dispersion-reference constraint), for example the band centre.

  # ----------------------------------------------------------------- radiometry
  pixel_etendue:
    dims: [los, pixelcolumn]
    dtype: float
    units: m2 sr
    required: true
    exclusive_min: 0
    role: instrument
    description: >
      Effective etendue of each pixel, including the interferometer port fraction,
      the flat field, and the wavenumber-independent part of the system efficiency.

  spectral_transmission:
    dims: [transmission_wavenumber]
    dtype: float
    units: "1"
    required: true
    valid_min: 0
    valid_max: 1
    role: instrument
    description: >
      Wavenumber-dependent throughput: filter transmission times the spectral
      shape of the optics and detector quantum efficiency. Zero outside the
      tabulated range.

  transmission_wavenumber:
    dims: [transmission_wavenumber]
    dtype: float
    units: cm-1
    required: true
    exclusive_min: 0
    role: instrument
    description: Vacuum wavenumbers at which spectral_transmission is tabulated.

  # ------------------------------------------------------------------- detector
  dark_offset:
    dims: [los, pixelcolumn]
    dtype: float
    units: count
    required: true
    valid_min: 0
    role: instrument
    open_questions: [dark-model]
    description: >
      Signal of each pixel at zero exposure time (bias). Subtracted in L1A→L1B and
      excluded from the shot-noise estimate.

  dark_current:
    dims: [los, pixelcolumn]
    dtype: float
    units: count s-1
    required: false
    default: 0.0
    valid_min: 0
    role: instrument
    open_questions: [dark-model]
    description: >
      Dark signal rate of each pixel at the detector's operating temperature. Its
      electrons have shot noise like the photo-electrons.

  detector_gain:
    dims: []
    dtype: float
    units: "1"
    required: true
    exclusive_min: 0
    role: instrument
    description: >
      Electrons per count. Converts L1A `image` to electrons for the shot-noise
      estimate and sets the quantization noise.

  detector_read_noise:
    dims: []
    dtype: float
    units: "1"
    required: true
    valid_min: 0
    role: instrument
    description: RMS read noise per exposure, in electrons.

  detector_full_well:
    dims: []
    dtype: float
    units: "1"
    required: false
    valid_min: 0
    role: instrument
    description: Full-well capacity, in electrons.

  detector_adc_bits:
    dims: []
    dtype: int
    units: "1"
    required: false
    valid_min: 1
    role: instrument
    description: ADC resolution.

  dead_time:
    dims: []
    dtype: float
    units: s
    required: false
    valid_min: 0
    role: instrument
    description: Dead time between consecutive exposures.

  # ---------------------------------------------------------- L1B output grid
  sample_wavenumber:
    dims: [los, spectral_sample]
    dtype: float
    units: cm-1
    required: true
    exclusive_min: 0
    role: instrument
    description: >
      Vacuum wavenumber of each L1B spectral sample for each row. Becomes
      `wavenumber` in L1B. Rows may differ, but the L2 retrieval currently needs
      the same samples on every row it uses.

constraints:
  - id: edge-lengths
    rule: >
      len(los_edge) = len(los) + 1 and len(pixelcolumn_edge) = len(pixelcolumn) + 1,
      and los and pixelcolumn match the L1A granules processed with this database.
  - id: opd-monotonic
    rule: opd is finite and strictly monotonic along pixelcolumn_edge at every row edge.
  - id: transmission-covers-samples
    rule: >
      transmission_wavenumber spans every sample_wavenumber, and
      spectral_transmission is greater than 0 at every sample.
  - id: samples-increasing
    rule: sample_wavenumber is strictly increasing along spectral_sample in every row.
  - id: samples-off-dc
    rule: >
      In every row, no sample_wavenumber lies within half a sample spacing of the
      row's Littrow wavenumber; that sample cannot be separated from the DC term.
  - id: samples-one-sided
    rule: >
      In every row, all samples lie on the same side of the Littrow wavenumber;
      samples at ±Δ alias onto the same fringe frequency.
  - id: dispersion-complete
    rule: >
      If fringe_frequency_scale or dispersion_phase is present, then
      dispersion_wavenumber and dispersion_reference_wavenumber are also present.
  - id: dispersion-covers-band
    rule: >
      dispersion_wavenumber spans every sample_wavenumber and every
      transmission_wavenumber where spectral_transmission is greater than 0.
  - id: dispersion-reference
    rule: >
      At dispersion_reference_wavenumber, fringe_frequency_scale = 1,
      dispersion_phase = 0, and the slope of dispersion_phase is 0. Without these,
      a constant ψ is indistinguishable from a shift of fringe_phase, a linear ψ
      from an offset of opd, and an overall scale on s from a scale on opd.
  - id: invertible
    rule: >
      For every row, the pixel-averaged model evaluated at sample_wavenumber
      (including the DC term) has full column rank and a condition number below
      1e6. Well-posed calibrations are about 1.5; aliased samples are rejected.
  - id: dark-within-adc
    rule: >
      If detector_adc_bits is present, dark_offset is below the ADC maximum,
      2^detector_adc_bits − 1 counts, at every pixel.
  - id: finite-values
    rule: Every floating-point value in the database is finite.

open_questions:
  - id: dark-model
    question: >
      How is the dark estimate D for each image determined in flight, and what
      does the calibration database need to hold for it?
    context: >
      Candidates are dark frames (shutter closed or a blank scene) between
      observation sets, with D for each image interpolated in detector
      temperature between the bracketing dark frames, or masked detector rows or
      columns. Temperature interpolation needs detector_temperature in L1A and
      possibly a per-pixel temperature coefficient here. L1A→L1B takes D as an
      input, so the method can change without changing the rest of the
      processing. Until it is decided, D is the static dark_offset +
      t · dark_current, and the dark estimate's own noise is not propagated.
